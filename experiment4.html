<!DOCTYPE html>
<html>
<head>
    <title>Hotel Room Booking Form</title>
</head>
<body>

    <center>
        <fieldset style="width: 400px;">
            <h1>Hotel Room Booking Form</h1>

            <form action="submit_booking.html" method="post">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
                <br><br>

                <label for="checkin">Check-in Date:</label>
                <input type="date" id="checkin" name="checkin" required>
                <br><br>

                <label for="checkout">Check-out Date:</label>
                <input type="date" id="checkout" name="checkout" required>
                <br><br>

                <label for="room">Room Type:</label>
                <select id="room" name="room">
                    <option>Single Room</option>
                    <option>Double Room</option>
                    <option>Deluxe Room</option>
                    <option>Suite</option>
                </select>
                <br><br>

                <label for="guests">Number of Guests:</label>
                <input type="number" id="guests" name="guests"
                       min="1" style="width: 60px;" required>
                <br><br>

                <label for="requests">
                    <u>Special Requests:</u>
                </label>
                <br><br>

                <textarea id="requests" name="requests"
                          rows="4" cols="45"></textarea>
                <br><br>

                <input type="submit" value="Book Now">
                <input type="reset" value="Reset Form">

            </form>
        </fieldset>
    </center>

</body>
</html>
